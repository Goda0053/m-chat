<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>S.I.D. - Interactive Chat Console</title>
  <style>
    :root {
      --bg-dark: #0a0d14;
      --bg-card: #121824;
      --bg-bubble: #1a2336;
      --bg-user: #103b66;
      --cyan: #00f0ff;
      --red: #ff3366;
      --gold: #ffb700;
      --text: #e1e7ed;
      --muted: #64748b;
      --border: rgba(0, 240, 255, 0.15);
    }
    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      -webkit-tap-highlight-color: transparent; 
    }
    
    html, body { 
      width: 100%; 
      height: 100%; 
      height: 100dvh; 
      background: var(--bg-dark); 
      color: var(--text); 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
      overflow: hidden; 
      position: fixed;
      top: 0;
      left: 0;
    }
    
    #app {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100%;
      height: 100dvh;
      max-width: 500px;
      margin: 0 auto;
      background: #07090e;
      position: relative;
    }

    header {
      height: 48px;
      background: rgba(18,24,36,0.95);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      flex-shrink: 0;
      z-index: 10;
    }
    .org-title { font-size: 0.85rem; font-weight: bold; color: var(--cyan); display: flex; align-items: center; gap: 6px; }
    .org-badge { font-size: 0.65rem; background: rgba(255,51,102,0.2); border: 1px solid var(--red); color: var(--red); padding: 2px 6px; border-radius: 4px; }

    .chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior-y: contain;
    }

    .chat-msg { display: flex; gap: 8px; max-width: 85%; }
    .chat-msg.sys { max-width: 100%; justify-content: center; }
    .sys-banner { background: rgba(0,240,255,0.05); border: 1px dashed var(--border); padding: 6px 12px; border-radius: 4px; font-size: 0.75rem; color: var(--cyan); text-align: center; line-height: 1.4; }
    .chat-msg.user { align-self: flex-end; flex-direction: row-reverse; }

    .avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #2a364f;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      border: 1px solid var(--border);
      flex-shrink: 0;
      color: var(--gold);
    }

    .msg-body { display: flex; flex-direction: column; max-width: 100%; }
    .msg-author { font-size: 0.65rem; color: var(--muted); margin-bottom: 2px; }
    .chat-msg.user .msg-author { text-align: right; }

    .bubble {
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 0.85rem;
      line-height: 1.5;
      word-break: break-word;
      background: var(--bg-bubble);
      white-space: pre-wrap;
    }
    .chat-msg.user .bubble { background: var(--bg-user); color: #fff; }

    .typing-bubble {
      display: inline-flex;
      align-items: center;
      width: fit-content;
      padding: 6px 12px;
      font-size: 0.75rem;
      line-height: 1;
      white-space: nowrap;
    }

    .typing-box {
      color: var(--cyan);
      display: inline-flex;
      align-items: center;
      gap: 1px;
    }
    .typing-dots span {
      display: inline-block;
      animation: blink 1.4s infinite both;
      font-weight: bold;
    }
    .typing-dots span:nth-child(1) { animation-delay: .0s; }
    .typing-dots span:nth-child(2) { animation-delay: .2s; }
    .typing-dots span:nth-child(3) { animation-delay: .4s; }
    @keyframes blink {
      0% { opacity: .2; }
      20% { opacity: 1; }
      100% { opacity: .2; }
    }

    /* 複数画像用のグリッドコンテナ */
    .msg-images-grid {
      display: grid;
      grid-gap: 6px;
      margin-top: 6px;
    }
    /* 1枚のとき */
    .msg-images-grid.count-1 {
      grid-template-columns: 1fr;
      max-width: 220px;
    }
    /* 2枚以上のとき（2列並び） */
    .msg-images-grid.count-multi {
      grid-template-columns: repeat(2, 1fr);
      max-width: 260px;
    }

    .msg-image {
      width: 100%;
      height: 110px;
      border-radius: 6px;
      border: 1px solid var(--border);
      object-fit: cover;
      cursor: pointer;
      display: block;
      background: #0f141f;
    }
    /* 1枚だけの時は大きめに表示 */
    .msg-images-grid.count-1 .msg-image {
      height: auto;
      max-height: 200px;
    }

    .options-bar {
      padding: 8px 10px;
      background: rgba(18,24,36,0.9);
      border-top: 1px dashed rgba(0,240,255,0.2);
      display: flex;
      gap: 6px;
      overflow-x: auto;
      flex-shrink: 0;
      scrollbar-width: none;
    }
    .options-bar::-webkit-scrollbar { display: none; }
    .options-bar:empty { display: none; }

    .option-btn {
      background: rgba(0,240,255,0.15);
      border: 1px solid var(--cyan);
      color: var(--cyan);
      font-size: 0.75rem;
      font-weight: 500;
      padding: 6px 12px;
      border-radius: 16px;
      cursor: pointer;
      white-space: nowrap;
    }
    .option-btn:hover { background: var(--cyan); color: #000; }
    .option-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .chat-input-area {
      padding: 8px 8px calc(8px + env(safe-area-inset-bottom, 0px)) 8px;
      background: rgba(18,24,36,0.98);
      border-top: 1px solid var(--border);
      display: flex;
      gap: 6px;
      align-items: center;
      flex-shrink: 0;
      z-index: 20;
    }
    
    .chat-input-area input[type="text"] {
      flex: 1;
      background: #0a0d14;
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 8px 14px;
      color: #fff;
      font-size: 16px;
      outline: none;
      transition: background 0.2s, border-color 0.2s;
    }

    .chat-input-area input[type="text"]:disabled {
      background: #141822;
      border-color: rgba(255,255,255,0.08);
      color: var(--muted);
      cursor: not-allowed;
    }

    .file-attach-btn {
      background: none;
      border: none;
      color: var(--cyan);
      font-size: 1.2rem;
      cursor: pointer;
      padding: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .file-attach-btn.disabled {
      opacity: 0.3;
      pointer-events: none;
    }

    .chat-input-area button.send-btn {
      background: var(--cyan);
      color: #000;
      border: none;
      border-radius: 18px;
      padding: 8px 16px;
      font-weight: bold;
      font-size: 0.85rem;
      cursor: pointer;
      flex-shrink: 0;
    }
    .chat-input-area button.send-btn:disabled {
      background: #2a364f;
      color: var(--muted);
      cursor: not-allowed;
    }

    .img-modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.9);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .img-modal.active { display: flex; }
    .img-modal img { max-width: 90%; max-height: 90%; border-radius: 8px; border: 1px solid var(--cyan); }
  </style>
</head>
<body>

  <div id="app">
    <header>
      <div class="org-title">⚡ S.I.D. CONSOLE</div>
      <div class="org-badge">機密 LEVEL 3</div>
    </header>

    <div class="chat-container" id="chat-box">
      <div class="chat-msg sys">
        <div class="sys-banner" id="status-banner">暗号化通信チャネル #04 接続中...</div>
      </div>
    </div>

    <div class="options-bar" id="options-bar"></div>

    <div class="chat-input-area">
      <label class="file-attach-btn" id="attach-label" title="画像を添付">
        📷
        <input type="file" id="user-file-input" accept="image/*" style="display:none;" onchange="handleUserImage(event)">
      </label>
      <input type="text" id="chat-input" placeholder="指示を入力..." onkeypress="if(event.key==='Enter')sendMsg()">
      <button class="send-btn" id="send-btn" onclick="sendMsg()">送信</button>
    </div>
  </div>

  <div class="img-modal" id="img-modal" onclick="closeImgModal()">
    <img id="img-modal-target" src="" alt="拡大画像">
  </div>

  <script>
    const SHEET_ID = "1v8qLtwIIqpS0tk7oTAaZ0tEJ-QGAza0l2ihEtqr3eno";
    const SHEET_NAME = "chat";

    let autoReplies = [];
    let isProcessing = false;
    let hasActiveOptions = false;

    // 単体または複数カンマ区切りのURLを整形
    function parseImageUrls(rawStr) {
      if (!rawStr) return [];
      const parts = String(rawStr).split(/[,、\n]/).map(s => s.trim()).filter(s => s.length > 0);
      return parts.map(u => {
        if (u.includes("dropbox.com")) {
          u = u.replace(/\?dl=0$/, "").replace(/\?dl=1$/, "");
          u = u + (u.includes("?") ? "&raw=1" : "?raw=1");
        }
        return u;
      });
    }

    function normalizeStr(str) {
      if (!str) return "";
      return String(str)
        .replace(/[Ａ-Ｚａ-ｚ０-９]/g, s => String.fromCharCode(s.charCodeAt(0) - 0xFEE0))
        .toLowerCase()
        .replace(/\s+/g, '');
    }

    function updateBanner(text, isError = false) {
      const banner = document.getElementById('status-banner');
      if (banner) {
        banner.innerText = text;
        banner.style.color = isError ? 'var(--red)' : 'var(--cyan)';
        banner.style.borderColor = isError ? 'var(--red)' : 'var(--border)';
      }
    }

    function updateInputState() {
      const input = document.getElementById('chat-input');
      const sendBtn = document.getElementById('send-btn');
      const attachLabel = document.getElementById('attach-label');

      if (isProcessing) {
        input.disabled = true;
        sendBtn.disabled = true;
        attachLabel.classList.add('disabled');
        input.placeholder = "通信処理中...";
      } else if (hasActiveOptions) {
        input.disabled = true;
        sendBtn.disabled = true;
        attachLabel.classList.add('disabled');
        input.value = "";
        input.placeholder = "選択肢から選択してください";
      } else {
        input.disabled = false;
        sendBtn.disabled = false;
        attachLabel.classList.remove('disabled');
        input.placeholder = "指示を入力...";
      }
    }

    window.googleSheetCallback = function(json) {
      try {
        if (!json || !json.table || !json.table.rows) {
          updateBanner("⚠️ データの解析に失敗しました", true);
          return;
        }

        const rows = json.table.rows;
        const initialLogs = [];
        autoReplies = [];

        rows.forEach(r => {
          let author = "マル", avatar = "マ", text = "", trigger = "", images = [], options = "";

          r.c.forEach((cell, idx) => {
            const val = cell && cell.v !== null && cell.v !== undefined ? String(cell.v) : "";
            if (idx === 0 && val.trim()) author = val.trim();
            if (idx === 1 && val.trim()) avatar = val.trim();
            if (idx === 2) text = val;
            if (idx === 3) trigger = val.trim();
            if (idx === 4) images = parseImageUrls(val); // 複数URLをパース
            if (idx === 5) options = val.trim();
          });

          const rowData = { author, avatar, text, trigger, images, options };
          if (!trigger) {
            initialLogs.push(rowData);
          } else {
            autoReplies.push(rowData);
          }
        });

        updateBanner(`接続完了 (${autoReplies.length}件のルール読込済)`);
        renderInitialLogs(initialLogs);

      } catch (err) {
        console.error(err);
        updateBanner("⚠️ データ読み込みエラー", true);
      }
    };

    function loadGoogleSheet() {
      const script = document.createElement('script');
      script.src = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=responseHandler:googleSheetCallback&sheet=${encodeURIComponent(SHEET_NAME)}&_=${new Date().getTime()}`;
      script.onerror = function() {
        updateBanner("⚠️ スプレッドシートへのアクセスに失敗しました（共有設定を確認してください）", true);
      };
      document.body.appendChild(script);
    }

    document.addEventListener("DOMContentLoaded", () => {
      loadGoogleSheet();

      const inputEl = document.getElementById('chat-input');
      inputEl.addEventListener('focus', () => {
        setTimeout(() => {
          window.scrollTo(0, 0);
          const box = document.getElementById('chat-box');
          box.scrollTop = box.scrollHeight;
        }, 300);
      });
    });

    async function renderInitialLogs(logs) {
      let lastOptions = "";
      for (const msg of logs) {
        if (msg.text || (msg.images && msg.images.length > 0)) {
          await addMessageUI(msg.author, msg.avatar, msg.text, 'other', msg.images);
        }
        if (msg.options) lastOptions = msg.options;
      }
      if (lastOptions) {
        setOptions(lastOptions);
      } else {
        clearOptions();
      }
    }

    async function sendMsg(customText = null) {
      if (isProcessing) return;

      const input = document.getElementById('chat-input');
      const text = customText !== null ? customText : input.value.trim();
      if (!text) return;

      await addMessageUI('あなた', 'YOU', text, 'user');
      input.value = '';
      clearOptions();

      const normInput = normalizeStr(text);

      let matchedRule = null;
      for (const rule of autoReplies) {
        if (rule.trigger) {
          const triggerList = rule.trigger.split(/[,、]/).map(t => normalizeStr(t)).filter(t => t.length > 0);
          const isMatched = triggerList.some(singleTrigger => normInput.includes(singleTrigger));
          if (isMatched) {
            matchedRule = rule;
            break;
          }
        }
      }

      if (matchedRule) {
        isProcessing = true;
        updateInputState();

        const typingEl = showTypingIndicator(matchedRule.author, matchedRule.avatar);

        setTimeout(async () => {
          if (typingEl && typingEl.parentNode) {
            typingEl.parentNode.removeChild(typingEl);
          }

          // すべての画像がロード完了するまで待機
          await addMessageUI(matchedRule.author, matchedRule.avatar, matchedRule.text, 'other', matchedRule.images);

          if (matchedRule.options) {
            setOptions(matchedRule.options);
          } else {
            clearOptions();
          }

          isProcessing = false;
          updateInputState();
        }, 3000);
      } else {
        updateInputState();
      }
    }

    function showTypingIndicator(author, avatarText) {
      const box = document.getElementById('chat-box');
      const div = document.createElement('div');
      div.className = 'chat-msg';
      div.innerHTML = `
        <div class="avatar">${esc(avatarText)}</div>
        <div class="msg-body">
          <div class="msg-author">${esc(author)}</div>
          <div class="bubble typing-bubble">
            <span class="typing-box">
              返信中<span class="typing-dots"><span>.</span><span>.</span><span>.</span></span>
            </span>
          </div>
        </div>
      `;
      box.appendChild(div);
      box.scrollTop = box.scrollHeight;
      return div;
    }

    function handleUserImage(e) {
      if (isProcessing || hasActiveOptions) return;
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(event) {
        addMessageUI('あなた', 'YOU', '画像を送信しました', 'user', [event.target.result]);
      };
      reader.readAsDataURL(file);
      e.target.value = '';
    }

    // 複数画像対応のメッセージ描画処理（全画像の完了をPromise.allで待機）
    function addMessageUI(author, avatarText, text, type, imageUrls = []) {
      return new Promise((resolve) => {
        const box = document.getElementById('chat-box');
        const isUser = type === 'user';
        const msgDiv = document.createElement('div');
        msgDiv.className = `chat-msg ${isUser ? 'user' : ''}`;

        let imagesGridHtml = '';
        if (imageUrls && imageUrls.length > 0) {
          const gridClass = imageUrls.length === 1 ? 'count-1' : 'count-multi';
          const imgTags = imageUrls.map(url => `<img src="${esc(url)}" class="msg-image" alt="添付画像">`).join('');
          imagesGridHtml = `<div class="msg-images-grid ${gridClass}">${imgTags}</div>`;
        }

        msgDiv.innerHTML = `
          ${!isUser ? `<div class="avatar">${esc(avatarText)}</div>` : ''}
          <div class="msg-body">
            <div class="msg-author">${esc(author)}</div>
            <div class="bubble">${esc(text)}${imagesGridHtml}</div>
          </div>
        `;

        box.appendChild(msgDiv);
        box.scrollTop = box.scrollHeight;

        if (imageUrls && imageUrls.length > 0) {
          const imgElements = msgDiv.querySelectorAll('.msg-image');
          const promises = [];

          imgElements.forEach((img, idx) => {
            const url = imageUrls[idx];
            img.onclick = () => openImgModal(url);

            promises.push(new Promise(res => {
              if (img.complete) {
                res();
              } else {
                img.onload = () => res();
                img.onerror = () => {
                  console.warn("画像読み込み失敗:", url);
                  res();
                };
              }
            }));
          });

          Promise.all(promises).then(() => {
            box.scrollTop = box.scrollHeight;
            resolve();
          });
        } else {
          resolve();
        }
      });
    }

    function setOptions(optionsStr) {
      const bar = document.getElementById('options-bar');
      bar.innerHTML = '';
      if (!optionsStr) {
        clearOptions();
        return;
      }

      const opts = optionsStr.split(/[,、]/).map(s => s.trim()).filter(s => s.length > 0);
      if (opts.length === 0) {
        clearOptions();
        return;
      }

      hasActiveOptions = true;
      updateInputState();

      opts.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerText = opt;
        btn.onclick = () => {
          if (isProcessing) return;
          sendMsg(opt);
        };
        bar.appendChild(btn);
      });
    }

    function clearOptions() {
      document.getElementById('options-bar').innerHTML = '';
      hasActiveOptions = false;
      updateInputState();
    }

    function openImgModal(src) {
      const modal = document.getElementById('img-modal');
      document.getElementById('img-modal-target').src = src;
      modal.classList.add('active');
    }
    function closeImgModal() {
      document.getElementById('img-modal').classList.remove('active');
    }

    function esc(s) {
      return String(s || '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
    }
  </script>
</body>
</html>
